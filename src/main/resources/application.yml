# src/main/resources/application.yml
spring:
  application:
    name: roomit
  datasource:
    url: jdbc:mysql://localhost:3330/capstone
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
