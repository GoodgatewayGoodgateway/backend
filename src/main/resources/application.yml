spring:
  datasource:
    url: jdbc:mysql://34.64.54.118:3306/cpastone?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082
  address: 0.0.0.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    defaultModelsExpandDepth: -1

  default-consumes-media-type: application/json
  default-produces-media-type: application/json

  info:
    title: RooMIT API 문서
    description: |
      룸메이트 매칭을 위한 백엔드 API 명세서입니다.  
      사용자 등록, 로그인, 프로필 저장, 관심사/선택옵션 저장까지 전부 포함돼 있습니다.
    version: 1.0.0
    contact:
      name: RooMIT 개발팀
      email: roomit.team@example.com

cloud:
  aws:
    s3:
      bucket:
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      access-key: IAM계정
      secret-key: IAM비번
